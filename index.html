<title>My Health</title>
<style>
:root{--bg:#f7f4f2;--card:#fff;--text:#2d2a32;--muted:#8a8494;--line:#ece7e4;--accent:#d6739a;--soft:#f3eef0;--bar:rgba(255,255,255,.9);--r:18px;--shadow:0 1px 2px rgba(60,30,50,.04),0 4px 16px rgba(60,30,50,.06);--c-cycle:#e8789a;--c-skin:#ee967a}
@media (prefers-color-scheme:dark){:root{--bg:#141217;--card:#1f1c23;--text:#f1edf3;--muted:#9b94a4;--line:#302b35;--soft:#2a262f;--bar:rgba(28,25,32,.9);--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom));min-height:100vh}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.35;cursor:default}
#main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 16px 24px}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 0 14px;min-height:60px}
.hdr h1{font-size:28px;font-weight:750;letter-spacing:-.6px;margin:0;line-height:1.15}
.hdr .sub{color:var(--muted);font-size:14px;font-weight:500}
.back{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:26px;line-height:1;padding-bottom:3px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px;font-weight:680;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:650;margin:18px 4px 9px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:15px;font-size:16px;font-weight:650;background:var(--accent);color:#fff;padding:0 18px}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.danger{background:transparent;color:#d0475f;border:1.5px solid #f0c6ce}
.btn.sm{min-height:40px;width:auto;font-size:14px;padding:0 14px;border-radius:12px;display:inline-flex}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stats.s2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--soft);border-radius:14px;padding:10px 10px 9px;min-width:0}
.stat b{display:block;font-size:20px;font-weight:750;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:550}
.s4 .stat b{font-size:17px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{min-height:76px!important}
.qa button{border:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:650;min-height:80px}
.ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.list .it:first-child{border-top:0;padding-top:2px}
.it .tx{flex:1;min-width:0}
.it .t{font-weight:620;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{font-size:12.5px;color:var(--muted);text-align:right;flex:none}
.it .chev{color:var(--muted);font-size:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;min-height:40px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.inp{width:100%;font-size:16px;font-family:inherit;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);min-height:48px;-webkit-appearance:none;appearance:none;display:block}
textarea.inp{resize:vertical;min-height:80px}
.inp:focus{outline:none;border-color:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}
.fld{grid-column:span 2;min-width:0}
.fld.half{grid-column:span 1}
.lbl{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px 2px}
.hint{font-size:12px;color:var(--muted);margin:5px 2px 0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px}
.scale .e{font-size:27px;line-height:1.15}
.scale .n{font-size:20px;font-weight:750;line-height:1.3}
.scale small{font-size:10.5px;color:var(--muted)}
.scale button.on{border-color:var(--accent);background:rgba(214,115,154,.13)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper>button:not(.link){width:48px;height:48px;border-radius:50%;border:0;background:var(--soft);font-size:24px}
.stepper .v{min-width:56px;text-align:center;font-size:22px;font-weight:750}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:650;color:var(--muted);text-decoration:none;min-height:54px;max-width:110px}
.tabbar a.on{color:var(--accent)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(25,12,30,0);z-index:50;transition:background .25s;display:flex;align-items:flex-end;justify-content:center}
.ov.open{background:rgba(25,12,30,.4)}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.ov.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.sh-title{font-weight:720;font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{background:none;border:0;color:var(--accent);font-size:16px;padding:8px 4px;min-width:64px;text-align:left;min-height:40px}
.link.b{font-weight:720;text-align:right}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
.sh-foot{margin-top:20px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#2d2a32;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tl{fill:var(--muted);font-size:10px}
.chart .tv{fill:var(--muted);font-size:9.5px;font-weight:600}
.chart .dot{stroke:var(--card);stroke-width:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);text-align:center;padding:16px 8px;font-size:14px}
.empty-chart{color:var(--muted);font-size:14px;display:grid;place-items:center;height:120px;background:var(--soft);border-radius:14px;text-align:center;padding:10px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-nav button{width:40px;height:40px;border:0;border-radius:11px;background:var(--soft);font-size:20px}
.cal-nav b{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:650;padding:2px 0 4px}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;position:relative;border:2px solid transparent;background:none;padding:0;width:100%;max-width:46px;margin:0 auto}
.cal .d.out{visibility:hidden}
.cal .d.per{background:var(--c-cycle);color:#fff;font-weight:750}
.cal .d.pred{border:2px dashed var(--c-cycle);color:var(--c-cycle);font-weight:650}
.cal .d.fert{background:rgba(95,185,138,.18);color:#2f8a5e}
.cal .d.ovu{background:#5fb98a;color:#fff;font-weight:750}
.cal .d.today{box-shadow:0 0 0 2px var(--text)}
.cal .d.sym::after{content:'';position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:#a77bd0}
.cal .d.per.sym::after{background:#fff}
.hero{border-radius:22px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#f093b0,#d8789e 55%,#b07bbd);margin-bottom:14px;box-shadow:0 8px 24px rgba(214,115,154,.28)}
.hero .o{opacity:.88;font-size:14px;font-weight:600}

        if(out.length<420000)break;q=Math.max(.45,q-.08);max=Math.round(max*.85);}

function exportData(share){

  var name='health-backup-'+today()+'.json', blob=new Blob([payload],{type:'application/json'});

  if(share&&navigator.canShare){try{var file=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Health backup'}).then(done).catch(function(){});return;}}catch(e){}}

  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},4000);

    var prev=D;D=normalize(data);if(!save()){D=prev;return;}state.lim={};render();toast('Backup restored · '+n+' entries');};
